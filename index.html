<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003366">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Levantamento de Campo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btnHome" class="top-btn"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-6h4v6"/></svg> Home</button>    <div id="topTitle">Levantamento de Campo</div>
    <button id="btnMenu" class="top-btn">⋮</button>
  </header>

  <main id="view"></main>

  <div id="menu" class="hidden">
    <button data-act="editar">📝 Editar lista (colar do Excel)</button>
    <button data-act="relatorio">📄 Relatório em PDF (com fotos)</button>
    <button data-act="exportar">⬇️ Exportar levantamento</button>
    <button data-act="colarlink">📋 Colar link do orçamento</button>
    <button data-act="importar">⬆️ Importar levantamento</button>
    <button data-act="nuvem">☁ Nuvem</button>
    <button data-act="apagar" class="danger">🗑️ Apagar tudo</button>
  <div id="versao" style="font-size:11px;color:#8C8C8C;text-align:center;padding:4px"></div>
  </div>
</div>

<input type="file" id="fileFoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fileVideo" accept="video/*" capture="environment" hidden>
<input type="file" id="fileGaleria" accept="image/*,video/*" hidden>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<div id="print-area"></div>
<div id="overlay" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="jspdf.umd.min.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
<script src="nuvem.js"></script>
</body>
</html>
